<style>
.lbl{font-size:.88rem;font-weight:500;color:#26335a}
.fld{display:grid;gap:5px;position:relative}.fld[hidden]{display:none}
.row.one{grid-template-columns:1fr}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#f3f5fb;border-radius:12px;padding:4px;margin-top:5px}
.seg label{display:block;position:relative;gap:0}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.seg span{display:block;text-align:center;padding:9px 6px;border-radius:9px;font-weight:600;color:#26335a;transition:.2s}
.seg input:checked+span{background:#0a57b8;color:#fff;box-shadow:0 4px 12px rgba(10,87,184,.3)}
.seg input:focus-visible+span{outline:2px solid #2f8cf0;outline-offset:2px}
.step{display:flex;align-items:center;justify-content:space-between;background:#f3f5fb;border:1.5px solid #d5dbec;border-radius:10px;padding:5px 8px}
.step b{font-size:1.1rem;min-width:2ch;text-align:center}
.step button{width:34px;height:34px;border-radius:50%;border:0;background:#0a57b8;color:#fff;font-size:1.2rem;line-height:1;cursor:pointer;transition:.2s}
.step button:disabled{background:#c5d3ea;cursor:not-allowed}
.dp{position:relative}.dp input{cursor:pointer}
.cal{position:absolute;z-index:40;top:calc(100% + 6px);inset-inline-start:0;width:292px;max-width:calc(100vw - 48px);background:#fff;border:1px solid #d5dbec;border-radius:14px;box-shadow:0 18px 50px rgba(10,87,184,.28);padding:12px;animation:rise .2s both}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nv{width:32px;height:32px;border-radius:50%;border:0;background:#eaf4ff;color:#0a57b8;font-size:1.3rem;line-height:1;cursor:pointer}
.nv:disabled{opacity:.35;cursor:not-allowed}[dir=rtl] .nv{transform:scaleX(-1)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cg i{font-style:normal;font-size:.72rem;color:#5a6f94;padding:4px 0}
.cg button{border:0;background:none;border-radius:8px;padding:8px 0;cursor:pointer;color:#0b2a5b;font-size:.92rem}
.cg button:hover:not(:disabled){background:#eaf4ff}
.cg button.sel{background:#0a57b8;color:#fff;font-weight:700}
.cg button:disabled{color:#b9c4da;cursor:not-allowed}
.row label{position:relative}
.ac{position:absolute;z-index:45;top:100%;inset-inline:0;margin-top:4px;max-height:272px;overflow:auto;background:#fff;border:1px solid #d5dbec;border-radius:12px;box-shadow:0 18px 50px rgba(10,87,184,.28)}
.ac[hidden]{display:none}
.ac div{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-weight:400;color:#0b2a5b}
.ac div b{font-weight:600}.ac div span{flex:1;font-size:.8rem;color:#55627f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac div em{font-style:normal;font-weight:700;font-size:.8rem;color:#0a57b8;background:#eaf4ff;border-radius:6px;padding:1px 7px}
.ac div.on,.ac div:hover{background:#eaf4ff}
#ld{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:linear-gradient(135deg,#0a57b8,#2f8cf0);transition:opacity .45s,visibility .45s}
#ld.off{opacity:0;visibility:hidden}
#ld .orb{position:relative;width:110px;height:110px;border:2px solid rgba(255,255,255,.25);border-radius:50%;animation:lo 1.6s linear infinite}
#ld svg{position:absolute;top:-17px;left:50%;width:34px;height:34px;margin-left:-17px;transform:rotate(90deg)}
@keyframes lo{to{transform:rotate(360deg)}}
.row.ft{grid-template-columns:1fr auto 1fr;align-items:end}
.swap{width:42px;height:42px;border-radius:50%;border:0;background:#0a57b8;color:#fff;cursor:pointer;display:grid;place-items:center;margin-bottom:2px;transition:background .2s}
.swap:hover{background:#2f8cf0}
.swap svg{--b:0deg;transition:transform .35s;transform:rotate(calc(var(--b) + var(--r,0deg)))}
@media(max-width:480px){.row.ft{grid-template-columns:1fr}.swap{justify-self:center}.swap svg{--b:90deg}}
a.btn{display:block;text-align:center}
.sec{padding:44px 0 0}.sec[hidden]{display:none}.sec h2{font-size:1.7rem;color:#0a57b8}.sec .sub{color:var(--mut);margin:2px 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.fc,.of{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(10,87,184,.12);overflow:hidden}
.fc{padding:16px;display:grid;gap:4px}.fc b{font-size:1.1rem;color:#0a57b8}.fc small{color:var(--mut)}
.of{display:flex;flex-direction:column;transition:transform .25s}.of:hover{transform:translateY(-4px)}
.of img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#eaf4ff}
.of .ob{padding:14px 16px 16px;display:grid;gap:8px;flex:1;align-content:start}.of h3{font-size:1.1rem}.of p{color:var(--mut);font-size:.92rem}
.of .btn{padding:10px;text-align:center;letter-spacing:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;padding-bottom:48px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.hint{font-size:.82rem;color:#55627f;text-align:center}
.seg.three{grid-template-columns:repeat(3,1fr)}.seg.three span{padding:9px 4px;font-size:.92rem}.seg.bad{outline:1.5px solid #d33;outline-offset:1px}
.acct{border:1px solid var(--gold);border-radius:99px;padding:5px 14px;background:none;color:inherit;cursor:pointer;transition:.25s}.acct:hover{background:var(--gold);color:#fff}
.ov{position:fixed;inset:0;z-index:100;background:rgba(5,15,40,.55);display:grid;place-items:center;padding:16px}
.ov[hidden],.ov [hidden],#quota[hidden]{display:none!important}
.md{width:min(420px,100%);max-height:calc(100vh - 32px);overflow:auto;position:relative}
.x{position:absolute;top:10px;inset-inline-end:14px;border:0;background:none;font-size:1.7rem;line-height:1;cursor:pointer;color:inherit}
.lnk{background:none;border:0;color:#0a57b8;cursor:pointer;text-decoration:underline;padding:4px;font-size:.92rem}
.ck{display:flex;align-items:center;gap:8px}.ck input{width:auto!important}
.note.info{background:#eaf4ff;color:#0a57b8}
#quota{font-weight:600}
</style>

    <path fill="#fff" transform="translate(790 190) scale(1.4)" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></g>
    <g fill="#fff" fill-opacity=".45"><ellipse cx="120" cy="470" rx="170" ry="26"/><ellipse cx="300" cy="520" rx="220" ry="22"/><ellipse cx="90" cy="120" rx="120" ry="16"/></g>

<script>
const $ = id => document.getElementById(id);
const WA = '963953536602';   // +963 953 536 602 (wa.me için + ve boşluk yok)
Object.assign(T.en, {
  form_s:'Enter your trip details and send them to us on WhatsApp.', trip:'Trip type', one:'One way', round:'Round trip', pax:'Passengers', ret:'Return date', pick:'Select date',
  e_same:'Departure and destination cannot be the same.', e_ret:'Return date cannot be earlier than the departure date.',
  wa_open:'Opening WhatsApp… just press Send.', wa_hint:'You will continue in WhatsApp — just press Send.',
  wa_hello:'Hello ORBIT TRAVEL & TOURISM,', wa_req:'I would like to request a flight.', wa_trip:'Trip Type', wa_pax:'Passengers', wa_dep:'Departure', wa_dest:'Destination', wa_ddate:'Departure Date', wa_rdate:'Return Date', wa_thanks:'Thank you!'
});
Object.assign(T.ar, {
  form_s:'أدخل تفاصيل رحلتك وأرسلها لنا عبر واتساب.', trip:'نوع الرحلة', one:'ذهاب فقط', round:'ذهاب وعودة', pax:'عدد المسافرين', ret:'تاريخ العودة', pick:'اختر التاريخ',
  e_same:'لا يمكن أن تكون المغادرة والوجهة نفسها.', e_ret:'لا يمكن أن يكون تاريخ العودة قبل تاريخ المغادرة.',
  wa_open:'جارٍ فتح واتساب… يكفي الضغط على إرسال.', wa_hint:'ستكمل في واتساب — يكفي الضغط على إرسال.',
  wa_hello:'مرحبًا ORBIT TRAVEL & TOURISM،', wa_req:'أرغب في طلب رحلة طيران.', wa_trip:'نوع الرحلة', wa_pax:'عدد المسافرين', wa_dep:'المغادرة', wa_dest:'الوجهة', wa_ddate:'تاريخ المغادرة', wa_rdate:'تاريخ العودة', wa_thanks:'شكرًا لكم!'
});

$('y').textContent = new Date().getFullYear();
$('tel').href = 'tel:' + CFG.phone.replace(/\s/g, ''); $('tel').textContent = CFG.phone;
$('mail').href = 'mailto:' + CFG.email; $('mail').textContent = CFG.email;

const pad = n => String(n).padStart(2, '0');
const L = () => loc() + (lang === 'ar' ? '-nu-latn' : '');
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const short = d => `${pad(d.getDate())} ${new Intl.DateTimeFormat(L(), { month: 'short' }).format(d)} ${d.getFullYear()}`;       // 15 Nov 2026
const long = d => `${d.getDate()} ${new Intl.DateTimeFormat(L(), { month: 'long' }).format(d)} ${d.getFullYear()}`;              // 15 November 2026
const D = { dep: null, ret: null };
let pax = 1, openW = null;
const round = () => document.querySelector('input[name=tt]:checked').value === 'round';

/* ---- takvim ---- */
const closeCal = () => { if (openW) { const c = openW.querySelector('.cal'); if (c) c.remove(); openW = null; } };
document.addEventListener('click', e => { if (openW && !openW.contains(e.target)) closeCal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCal(); });
function picker(key, minFn, onPick) {
  const inp = $(key), wrap = inp.closest('.dp'); let view;
  const draw = () => {
    let c = wrap.querySelector('.cal');
    if (!c) { c = document.createElement('div'); c.className = 'cal'; c.setAttribute('role', 'dialog'); wrap.append(c); c.addEventListener('click', e => {
      e.stopPropagation(); const b = e.target.closest('button'); if (!b || b.disabled) return;
      if (b.dataset.n) { view = new Date(view.getFullYear(), view.getMonth() + +b.dataset.n, 1); draw(); return; }
      D[key] = new Date(view.getFullYear(), view.getMonth(), +b.dataset.d); inp.value = short(D[key]); inp.classList.remove('bad');
      closeCal(); if (onPick) onPick();
    }); }
    const min = minFn(), y = view.getFullYear(), m = view.getMonth(), n = new Date(y, m + 1, 0).getDate(), off = new Date(y, m, 1).getDay();
    const wd = Array.from({ length: 7 }, (_, i) => `<i>${new Intl.DateTimeFormat(L(), { weekday: 'short' }).format(new Date(2023, 0, 1 + i))}</i>`).join('');
    let days = '<span></span>'.repeat(off);
    for (let d = 1; d <= n; d++) { const x = new Date(y, m, d); days += `<button type="button" data-d="${d}" ${x < min ? 'disabled' : ''} class="${D[key] && +D[key] === +x ? 'sel' : ''}">${d}</button>`; }
    c.innerHTML = `<div class="ch"><button type="button" class="nv" data-n="-1" ${new Date(y, m, 0) < min ? 'disabled' : ''}>‹</button><b>${new Intl.DateTimeFormat(L(), { month: 'long', year: 'numeric' }).format(view)}</b><button type="button" class="nv" data-n="1">›</button></div><div class="cg">${wd}${days}</div>`;
  };
  const toggle = () => { const was = openW === wrap; closeCal(); if (was) return; const b = D[key] || minFn(); view = new Date(b.getFullYear(), b.getMonth(), 1); openW = wrap; draw(); };
  inp.addEventListener('click', toggle);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
}
picker('dep', today, () => { if (D.ret && D.ret < D.dep) { D.ret = null; $('ret').value = ''; } });
picker('ret', () => D.dep || today());

/* ---- havalimanı otomatik tamamlama ---- */
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ı/g, 'i').toLowerCase();
AP_DATA.forEach(x => { x.c = norm(x.city); x.k = norm(`${x.code} ${x.city} ${x.name} ${x.ar || ''}`); });
function ac(id) {
  const inp = $(id), box = document.createElement('div'); let items = [], idx = 0;
  box.className = 'ac'; box.hidden = true; box.setAttribute('role', 'listbox'); inp.parentElement.append(box);
  const hide = () => { box.hidden = true; };
  const mark = () => [...box.children].forEach((c, i) => c.classList.toggle('on', i === idx));
  const pick = x => { inp.value = x.v; inp.classList.remove('bad'); hide(); };
  const show = () => {
    const q = norm(inp.value.trim()); if (!q) return hide();
    items = AP_DATA.map((x, i) => {
      const w = x.k.split(' ');
      const s = x.code.toLowerCase() === q ? 0 : (x.c.startsWith(q) || x.code.toLowerCase().startsWith(q)) ? 1 : w.some(z => z.startsWith(q)) ? 2 : x.k.includes(q) ? 3 : 9;
      return { x, s, i };
    }).filter(o => o.s < 9).sort((a, b) => a.s - b.s || a.i - b.i).slice(0, 8).map(o => o.x);
    if (!items.length) return hide();
    idx = 0;
    box.innerHTML = items.map((x, i) => `<div role="option" data-i="${i}"><b>${esc(lang === 'ar' && x.ar ? x.ar : x.city)}</b><span>${esc(x.name)}</span><em>${x.code}</em></div>`).join('');
    box.hidden = false; mark();
  };
  inp.addEventListener('input', show); inp.addEventListener('focus', show); inp.addEventListener('blur', hide);
  inp.addEventListener('keydown', e => {
    if (box.hidden) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = (idx + 1) % items.length; mark(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = (idx - 1 + items.length) % items.length; mark(); }
    else if (e.key === 'Enter' || e.key === 'Tab') { if (e.key === 'Enter') e.preventDefault(); pick(items[idx]); }
    else if (e.key === 'Escape') hide();
  });
  box.addEventListener('mousedown', e => { e.preventDefault(); const d = e.target.closest('[data-i]'); if (d) pick(items[+d.dataset.i]); });
}

Object.assign(T.en, {
  au_login:'Log in', au_reg:'Create account', au_logout:'Log out', au_s:'Log in or create an account to send flight requests.', au_phone:'Phone number (with country code)',
  au_user:'Username', au_user_o:'Username (optional)', au_pass:'Password', au_rem:'Remember me', au_to_reg:'No account? Create one', au_to_login:'Already have an account? Log in',

  au_e_tu:'This username is already taken.', au_e_tp:'An account with this phone number already exists.', au_e_cred:'Incorrect phone number or password.', au_e_um:'Username does not match this account.',
  au_e_gen:'Something went wrong. Please try again.', au_e_off:'Accounts are not available right now.',

  q_susp:'This account is suspended. Please contact the agency.', q_np:'This account cannot send flight requests. Please create a customer account.'
});
Object.assign(T.ar, {
  au_login:'تسجيل الدخول', au_reg:'إنشاء حساب', au_logout:'تسجيل الخروج', au_s:'سجّل الدخول أو أنشئ حسابًا لإرسال طلبات الرحلات.', au_phone:'رقم الهاتف (مع رمز الدولة)',
  au_user:'اسم المستخدم', au_user_o:'اسم المستخدم (اختياري)', au_pass:'كلمة المرور', au_rem:'تذكرني', au_to_reg:'ليس لديك حساب؟ أنشئ حسابًا', au_to_login:'لديك حساب؟ سجّل الدخول',
  au_need:'يرجى تسجيل الدخول أو إنشاء حساب لإرسال طلب رحلة.',
  au_e_phone:'أدخل رقم هاتف صحيحًا مع رمز الدولة، مثل 963 9xx xxx xxx+.', au_e_pass:'يجب ألا تقل كلمة المرور عن 8 أحرف.', au_e_user:'أدخل اسم مستخدم (من 3 إلى 30 حرفًا أو رقمًا أو . _ -).',
  au_e_tu:'اسم المستخدم مستخدم مسبقًا.', au_e_tp:'يوجد حساب بهذا الرقم مسبقًا.', au_e_cred:'رقم الهاتف أو كلمة المرور غير صحيحة.', au_e_um:'اسم المستخدم لا يطابق هذا الحساب.',
  au_e_gen:'حدث خطأ ما. حاول مرة أخرى.', au_e_off:'الحسابات غير متاحة حاليًا.',
  q_left:'عدد الطلبات المتبقية اليوم', q_none:'لقد استخدمت جميع طلباتك لهذا اليوم. تتجدد عند الساعة 00:00 بتوقيت دمشق.', q_err:'تعذّر التحقق من حصتك اليومية. حاول مرة أخرى.',
  q_susp:'هذا الحساب موقوف. يرجى التواصل مع الوكالة.', q_np:'لا يمكن لهذا الحساب إرسال طلبات رحلات. يرجى إنشاء حساب عميل.'
});
const remember = () => { try { return localStorage.getItem('orbit_remember') === '1'; } catch (e) { return false; } };
const setRemember = v => { try { localStorage.setItem('orbit_remember', v ? '1' : '0'); } catch (e) {} };
const store = {   // "remember me" -> localStorage (long-lived); otherwise sessionStorage (ends when the browser closes)
  getItem: k => { try { const a = remember() ? localStorage : sessionStorage, b = remember() ? sessionStorage : localStorage; return a.getItem(k) ?? b.getItem(k); } catch (e) { return null; } },
  setItem: (k, v) => { try { const r = remember(); (r ? localStorage : sessionStorage).setItem(k, v); (r ? sessionStorage : localStorage).removeItem(k); } catch (e) {} },
  removeItem: k => { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} }
};
const sb = configured() && window.supabase ? window.supabase.createClient(CFG.url, CFG.key, { auth: { storage: store, storageKey: 'orbit-user-auth', persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } }) : null;
const AUTH_DOMAIN = CFG.authDomain || (CFG.email.split('@')[1] || 'orbit-travel.com');
const emailOf = p => p.slice(1) + '@' + AUTH_DOMAIN;
const UN_RE = /^[\p{L}\p{N}._-]{3,30}$/u;
let USER = null, QUOTA = null, MODE = 'login', UNAME = false;

function normPhone(raw) {   // -> E.164 (+9639...) or null
  let s = String(raw || '').trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[\s\-().]/g, '');
  if (s.startsWith('00')) s = '+' + s.slice(2);
  else if (s.startsWith('+')) { /* already international */ }
  else if (s.startsWith('0')) s = '+963' + s.slice(1);    // local Syrian format: 09xx...
  else if (s.startsWith('963')) s = '+' + s;
  else return null;
  s = s.replace(/^\+9630/, '+963');
  return /^\+[1-9]\d{7,14}$/.test(s) ? s : null;
}
const anote = (k, c, d) => { const n = $('anote'); n.className = 'note show ' + (c || 'err'); n.dataset.k = k; n.dataset.d = d || ''; n.textContent = t(k) + (d ? ' [' + d + ']' : ''); };
function render() {
  const reg = MODE === 'reg';
  $('aut').textContent = t(reg ? 'au_reg' : 'au_login'); $('aub').textContent = t(reg ? 'au_reg' : 'au_login'); $('asw').textContent = t(reg ? 'au_to_login' : 'au_to_reg');
  $('aunw').hidden = !UNAME; $('aunl').textContent = t(reg ? 'au_user' : 'au_user_o'); $('apw').autocomplete = reg ? 'new-password' : 'current-password';
}
function ui() { $('acct').textContent = t(USER ? 'au_logout' : 'au_login'); drawQuota(); }
function drawQuota() { const q = $('quota'); if (!USER || !QUOTA) { q.hidden = true; return; } q.hidden = false; q.textContent = `${t('q_left')}: ${QUOTA.remaining}/${QUOTA.limit}`; }
async function refreshQuota() { if (!sb || !USER) { QUOTA = null; return drawQuota(); } const { data, error } = await sb.rpc('my_quota'); QUOTA = error ? null : data; drawQuota(); }
function openAuth(mode, gate) {
  MODE = mode; $('au').hidden = false; $('apw').value = ''; $('anote').className = 'note'; $('anote').textContent = ''; delete $('anote').dataset.k;
  $('arm').checked = remember(); render(); if (gate) anote('au_need', 'info'); setTimeout(() => $('aph').focus(), 50);
  if (sb) sb.rpc('get_registration_settings').then(({ data }) => { UNAME = !!(data && data.username_enabled); render(); });
}
const closeAuth = () => { $('au').hidden = true; };
async function consumeQuota() {
  $('go').disabled = true;
  try {
    const { data, error } = await sb.rpc('consume_flight_request');
    if (error || !data) { note('err', 'q_err'); return false; }
    if (!data.ok) {
      if (data.reason === 'limit') { QUOTA = { remaining: 0, limit: data.limit }; drawQuota(); note('err', 'q_none'); }
      else if (data.reason === 'suspended') note('err', 'q_susp');
      else if (data.reason === 'auth') openAuth('login', true);
      else note('err', 'q_np');
      return false;
    }
    QUOTA = { remaining: data.remaining, limit: data.limit }; drawQuota(); return true;
  } catch (e) { note('err', 'q_err'); return false; } finally { $('go').disabled = false; }
}
$('acct').addEventListener('click', () => { if (USER && sb) { sb.auth.signOut(); } else openAuth('login'); });
$('aux').addEventListener('click', closeAuth);
$('au').addEventListener('mousedown', e => { if (e.target === $('au')) closeAuth(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('au').hidden) closeAuth(); });
$('asw').addEventListener('click', () => { MODE = MODE === 'reg' ? 'login' : 'reg'; $('anote').className = 'note'; render(); });
$('auf').addEventListener('submit', async e => {
  e.preventDefault();
  if (!sb) return anote('au_e_off');
  const reg = MODE === 'reg', phone = normPhone($('aph').value), pass = $('apw').value, un = $('aun').value.trim();
  if (!phone) return anote('au_e_phone');
  if (reg && pass.length < 8) return anote('au_e_pass');
  if (!pass) return anote('au_e_cred');
  if (reg && UNAME && !UN_RE.test(un)) return anote('au_e_user');
  setRemember($('arm').checked); $('aub').disabled = true;
  try {
    if (reg) {
      if (UNAME) { const { data } = await sb.rpc('username_available', { u: un }); if (data === false) return anote('au_e_tu'); }
      const { error } = await sb.auth.signUp({ email: emailOf(phone), password: pass, options: { data: { phone, username: UNAME ? un : null } } });
      if (error) return error.code === 'user_already_exists' || /already/i.test(error.message) ? anote('au_e_tp') : anote('au_e_gen', 'err', error.code || error.message);
    }
    const { data, error } = await sb.auth.signInWithPassword({ email: emailOf(phone), password: pass });
    if (error || !data.session) return error && error.status === 400 && !/confirm/i.test(error.message) ? anote('au_e_cred') : anote('au_e_gen', 'err', error ? (error.code || error.message) : 'no session');
    if (!reg && UNAME && un) {
      const { data: pr } = await sb.from('customer_profiles').select('username').eq('id', data.session.user.id).maybeSingle();
      if (!pr || (pr.username || '').toLowerCase() !== un.toLowerCase()) { await sb.auth.signOut(); return anote('au_e_um'); }
    }
    closeAuth();
  } catch (err) { anote('au_e_gen', 'err', err && err.message); } finally { $('aub').disabled = false; }
});
document.addEventListener('langchange', () => {
  render(); ui(); const n = $('anote'); if (n.dataset.k && n.classList.contains('show')) n.textContent = t(n.dataset.k) + (n.dataset.d ? ' [' + n.dataset.d + ']' : '');
});
if (sb) {
  sb.auth.getSession().then(({ data }) => { USER = data.session ? data.session.user : null; ui(); refreshQuota(); });
  sb.auth.onAuthStateChange((ev, s) => { const u = s ? s.user : null, changed = (u && u.id) !== (USER && USER.id); USER = u; ui(); if (changed) setTimeout(refreshQuota, 0); });
}
</script>
