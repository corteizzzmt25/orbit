<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORBIT TRAVEL &amp; TOURISM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="logo.jpg"><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="common.js"></script>
<script src="airports.js"></script>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="index.html" data-logo></a>
  <nav class="nav">
    <a href="index.html" data-i="home"></a>
    <div class="contact"><a id="tel"></a><a id="mail"></a></div>
    <div class="lang"><button data-lang="en">English</button><button data-lang="ar">العربية</button></div>
  </nav>
</div></header>

<section class="hero">
  <svg class="bg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="#ffffff" stroke-opacity=".35"><circle cx="560" cy="300" r="120"/><ellipse cx="560" cy="300" rx="120" ry="45"/><ellipse cx="560" cy="300" rx="45" ry="120"/></g>
    <g class="spin" style="transform-origin:560px 300px"><ellipse cx="560" cy="300" rx="270" ry="110" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-dasharray="3 7" transform="rotate(-20 560 300)"/>
    <path fill="#fff" transform="translate(790 190) scale(1.4)" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></g>
    <g fill="#fff" fill-opacity=".45"><ellipse cx="120" cy="470" rx="170" ry="26"/><ellipse cx="300" cy="520" rx="220" ry="22"/><ellipse cx="90" cy="120" rx="120" ry="16"/></g>
  </svg>
  <div class="wrap">
    <div><h1 data-i="hero_t"></h1><p class="lead" data-i="hero_s"></p><div class="rule"></div></div>
    <div class="card">
      <h2 data-i="form_t"></h2><p class="s" data-i="form_s"></p>
      <form id="f" class="f" novalidate>
        <label><span data-i="name"></span><input id="n" autocomplete="name" maxlength="120" required></label>
        <label><span data-i="phone"></span><div class="phone"><select id="cc" aria-label="Country code"></select><input id="p" type="tel" inputmode="tel" autocomplete="tel-national" maxlength="15" required></div></label>
        <div class="row">
          <label><span data-i="from"></span><input id="a" list="ap" maxlength="120" autocomplete="off" required></label>
          <label><span data-i="to"></span><input id="b" list="ap" maxlength="120" autocomplete="off" required></label>
        </div>
        <label><span data-i="date"></span><div class="d3"><select id="dd" required></select><select id="mm" required></select><select id="yy" required></select></div></label>
        <label><span data-i="time"></span><input id="tm" type="time" required></label>
        <label><span data-i="msg"></span><textarea id="m" rows="3" maxlength="2000"></textarea></label>
        <div id="note" class="note" role="status" aria-live="polite"></div>
        <button class="btn" id="go" type="submit" data-i="submit"></button>
      </form>
    </div>
  </div>
</section>

<datalist id="ap"></datalist>
<footer><div class="wrap"><span>© <span id="y"></span> ORBIT TRAVEL &amp; TOURISM — <span data-i="foot"></span></span><a data-link="admin.html" data-i="staff"></a></div></footer>

<script>
const $ = id => document.getElementById(id);
const sb = configured() ? supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: false } }) : null;
const CODES = [['🇸🇦','+966'],['🇦🇪','+971'],['🇰🇼','+965'],['🇶🇦','+974'],['🇧🇭','+973'],['🇴🇲','+968'],['🇯🇴','+962'],['🇪🇬','+20'],['🇮🇶','+964'],['🇱🇧','+961'],['🇸🇾','+963'],['🇾🇪','+967'],['🇵🇸','+970'],['🇲🇦','+212'],['🇩🇿','+213'],['🇹🇳','+216'],['🇸🇩','+249'],['🇹🇷','+90'],['🇵🇰','+92'],['🇮🇳','+91'],['🇵🇭','+63'],['🇬🇧','+44'],['🇺🇸','+1'],['🇩🇪','+49'],['🇫🇷','+33'],['🇳🇱','+31']];
$('cc').innerHTML = CODES.map(([f, c]) => `<option value="${c}">${f} ${c}</option>`).join('');
$('ap').innerHTML = AIRPORTS.map(v => `<option value="${v}">`).join('');
$('y').textContent = new Date().getFullYear();
$('tel').href = 'tel:' + CFG.phone.replace(/\s/g, ''); $('tel').textContent = CFG.phone;
$('mail').href = 'mailto:' + CFG.email; $('mail').textContent = CFG.email;

function fillDate() {
  const keep = [$('dd').value, $('mm').value, $('yy').value], Y = new Date().getFullYear();
  const opt = (v, l) => `<option value="${v}">${l}</option>`;
  $('dd').innerHTML = opt('', t('day')) + Array.from({ length: 31 }, (_, i) => opt(i + 1, i + 1)).join('');
  $('mm').innerHTML = opt('', t('month')) + Array.from({ length: 12 }, (_, i) => opt(i + 1, new Intl.DateTimeFormat(loc(), { month: 'long' }).format(new Date(2000, i, 1)))).join('');
  $('yy').innerHTML = opt('', t('year')) + [Y, Y + 1, Y + 2].map(y => opt(y, y)).join('');
  [$('dd').value, $('mm').value, $('yy').value] = keep;
}
document.addEventListener('langchange', fillDate);

const note = (c, k) => { const n = $('note'); n.className = 'note show ' + c; n.textContent = t(k); n.dataset.k = k; };
document.addEventListener('langchange', () => { const n = $('note'); if (n.dataset.k && n.classList.contains('show')) n.textContent = t(n.dataset.k); });
let busy = false;

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;
  document.querySelectorAll('.bad').forEach(x => x.classList.remove('bad'));
  const v = { n: $('n').value.trim(), p: $('p').value.replace(/\D/g, '').replace(/^0+/, ''), a: $('a').value.trim(), b: $('b').value.trim(), tm: $('tm').value };
  const bad = [];
  if (v.n.length < 2) bad.push('n'); if (v.p.length < 6 || v.p.length > 14) bad.push('p');
  if (v.a.length < 2) bad.push('a'); if (v.b.length < 2) bad.push('b'); if (!v.tm) bad.push('tm');
  bad.forEach(id => $(id).classList.add('bad'));
  if (bad.length || !$('dd').value || !$('mm').value || !$('yy').value) { ['dd', 'mm', 'yy'].forEach(id => !$(id).value && $(id).classList.add('bad')); return note('err', 'e_req'); }
  const [D, M, Y] = [+$('dd').value, +$('mm').value, +$('yy').value], dt = new Date(Y, M - 1, D), today = new Date(); today.setHours(0, 0, 0, 0);
  if (dt.getMonth() !== M - 1 || dt < today) { ['dd', 'mm', 'yy'].forEach(id => $(id).classList.add('bad')); return note('err', 'e_date'); }
  if (!sb) return note('err', 'e_net');

  const row = { id: crypto.randomUUID(), full_name: v.n, phone_number: $('cc').value + v.p, departure_city: v.a, destination_city: v.b,
    departure_date: `${Y}-${String(M).padStart(2, '0')}-${String(D).padStart(2, '0')}`, departure_time: v.tm, additional_message: $('m').value.trim() || null };
  const sig = JSON.stringify([row.full_name, row.phone_number, row.departure_city, row.destination_city, row.departure_date, row.departure_time]);
  const last = JSON.parse(sessionStorage.getItem('orbit_last') || 'null');
  if (last && last.s === sig && Date.now() - last.t < 120000) return note('err', 'e_dup');

  busy = true; $('go').disabled = true; $('go').textContent = t('sending');
  const { error } = await sb.from('flight_requests').insert(row);   // insert only: customers have no read access
  busy = false; $('go').disabled = false; $('go').textContent = t('submit');
  if (error) return note('err', 'e_net');
  sessionStorage.setItem('orbit_last', JSON.stringify({ s: sig, t: Date.now() }));
  $('f').reset(); note('ok', 'ok');
});
</script>
</body>
</html>
